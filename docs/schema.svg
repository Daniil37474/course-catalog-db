<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
<title id="title">Course catalog database schema</title>
<desc id="desc">Courses and students each have a one to many relationship with enrollments. Each enrollment references exactly one course and one student. The course and student pair is unique.</desc>
<rect width="1000" height="610" fill="#f8fafc"/>
<style>text{font-family:Arial,sans-serif;fill:#172033}.head{fill:white;font-size:20px;font-weight:bold}.field{font-family:Consolas,monospace;font-size:16px}.note{font-size:14px;fill:#42526a}.line{stroke:#526981;stroke-width:2;fill:none}</style>
<text x="40" y="42" font-size="25" font-weight="bold">Course catalog database schema</text>

<rect x="40" y="80" width="430" height="241" rx="7" fill="white" stroke="#93a4b8"/>
<path d="M47,80 H463 Q470,80 470,87 V122 H40 V87 Q40,80 47,80" fill="#243e5b"/>
<text class="head" x="58" y="108">COURSES</text>
<text class="field" x="56" y="148">id             text PK</text>
<text class="field" x="56" y="180">title          text</text>
<text class="field" x="56" y="212">description    text</text>
<text class="field" x="56" y="244">credits        integer</text>
<text class="field" x="56" y="276">is_elective    boolean</text>
<text class="field" x="56" y="308">likes          integer</text>
<rect x="570" y="80" width="390" height="145" rx="7" fill="white" stroke="#93a4b8"/>
<path d="M577,80 H953 Q960,80 960,87 V122 H570 V87 Q570,80 577,80" fill="#243e5b"/>
<text class="head" x="588" y="108">STUDENTS</text>
<text class="field" x="586" y="148">id      bigint PK IDENTITY</text>
<text class="field" x="586" y="180">name    text</text>
<text class="field" x="586" y="212">email   text UNIQUE</text>
<rect x="255" y="380" width="490" height="177" rx="7" fill="white" stroke="#93a4b8"/>
<path d="M262,380 H738 Q745,380 745,387 V422 H255 V387 Q255,380 262,380" fill="#243e5b"/>
<text class="head" x="273" y="408">ENROLLMENTS</text>
<text class="field" x="271" y="448">id           bigint PK IDENTITY</text>
<text class="field" x="271" y="480">course_id    text FK</text>
<text class="field" x="271" y="512">student_id   bigint FK</text>
<text class="field" x="271" y="544">enrolled_at  timestamptz</text>
<path class="line" d="M210 321 V350 H370 V380"/><path class="line" d="M770 225 V350 H630 V380"/>
<text class="note" x="220" y="342">1 → 0..many · RESTRICT</text>
<text class="note" x="600" y="316">1 → 0..many · CASCADE</text>
<text class="note" x="270" y="584">UNIQUE (course_id, student_id) · All columns NOT NULL</text>
</svg>